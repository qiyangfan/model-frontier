name: CI

on:
  push:
    branches: [main]
  pull_request:

# 连续推送时取消上一轮，避免重复占用 runner；PR 与主干各自独立排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只读仓库内容即足够；产物上传走 Actions 运行时，不依赖额外权限
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # action 一律钉完整提交 SHA（tag 可被静默改写，供应链风险），版本号见行尾或上方注释
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      # E2E 使用仓库内确定性夹具，PR 门禁不访问任何源站（ADR-0014）；
      # 真实抓取的可用性与适配器漂移由 owner 本地日常刷新（启动即全量刷新）与适配器单测覆盖。
      # 夹具内容的缓存时间按运行时刻刷新，数据行保持固定。
      - name: 准备确定性 E2E 数据
        run: node tests/prepare-fixture.mjs "$RUNNER_TEMP/frontier-data"
      # 三套 E2E 是行为门禁（图表交互、门户六页、证据与历史流），必须在构建产物上跑：
      # 测试以 channel: "chrome" 启动真实 Chrome，并请求运行中的生产服务
      - name: 启动生产服务
        env:
          FRONTIER_DATA_DIR: ${{ runner.temp }}/frontier-data
          FRONTIER_AUTO_REFRESH: "0"
        run: |
          npm start &
          n=0
          until curl -sf http://127.0.0.1:4317/api/status > /dev/null; do
            n=$((n + 1))
            if [ "$n" -ge 30 ]; then
              echo "服务 30 秒内未就绪"
              exit 1
            fi
            sleep 1
          done
      - name: E2E：前沿探索
        run: npm run test:e2e
      - name: E2E：门户六页
        run: npm run test:portal
      - name: E2E：证据与历史
        run: npm run test:evidence
      # actions/upload-artifact v4：失败现场（截图）随产物上传，便于定位，不进仓库
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
